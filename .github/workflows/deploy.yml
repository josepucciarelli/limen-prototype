# Compila el sitio en cada push a main y publica el resultado en la rama "deploy".
# Hostinger (hPanel → Avanzado → Git) despliega la rama "deploy" en public_html.
name: Build y deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Prerenderizar páginas (HTML completo para buscadores)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node apps/web/tools/prerender.mjs dist/apps/web

      - name: Verificar build
        run: |
          test -f dist/apps/web/index.html
          test -f dist/apps/web/contact.html
          test -f dist/apps/web/404.html
          grep -q "<h1" dist/apps/web/index.html
          test -f dist/apps/web/.htaccess
          ls -la dist/apps/web

      - name: Publicar en rama deploy
        working-directory: dist/apps/web
        run: |
          git init -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
